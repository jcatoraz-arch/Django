<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ post.titulo }}</title>
</head>
<body>

    <h1>{{ post.titulo }}</h1>

    <p>{{ post.fecha }}</p>

    {% if post.imagen %}
        <img src="{{ post.imagen.url }}" width="500">
    {% endif %}

    <p>{{ post.texto }}</p>

    <a href="{% url 'blog:lista_posts' %}">Volver al blog</a>

</body>
</html>
<!-- muestra el post completo en su propia pagina-->
